name: tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install fonts and ffmpeg
        run: sudo apt-get update -q && sudo apt-get install -y -q fonts-inter ffmpeg libsndfile1
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests (spec number checks, renderer layouts, upload metadata)
        run: python -m pytest -q tests
