name: tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install fonts and ffmpeg
        run: sudo apt-get update -q && sudo apt-get install -y -q fonts-inter ffmpeg libsndfile1
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests (spec number checks, renderer layouts, upload metadata)
        run: python -m pytest -q tests
  shell-lint:
    # The render/upload driver scripts decide what gets uploaded; catch quoting and exit-code mistakes early.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck (preinstalled on GitHub's Ubuntu runners)
        run: shellcheck -S warning setup.sh tools/*.sh
